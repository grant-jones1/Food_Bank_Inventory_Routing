[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foodbank_ir"
version = "0.1.0"
description = "Multi-item food bank inventory routing with endogenous information acquisition (POMDP computational study)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Grant Jones" }]

dependencies = [
    "numpy",
    "pandas",
    "pyomo",
    "ortools",
    "highspy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = false
